name: Test workflow
on: pull_request
jobs:
  lint:
    name: Lint sources
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout
        uses: 'actions/checkout@master'

      - name: Set Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Lint Solidity sources
        run: npm run lint:sol
      - name: Lint TypeScript sources
        run: npm run lint:ts

  unit_test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout
        uses: 'actions/checkout@master'

      - name: Set Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Run test coverage
        run: npm run coverage
      - name: Upload coverage to action results
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: |
            coverage/
            coverage.json
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint, unit_test]
    if: always()
    steps:
      - name: Verify upstream jobs succeeded
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "unit_test: ${{ needs.unit_test.result }}"
          test "${{ needs.lint.result }}" = "success" -a "${{ needs.unit_test.result }}" = "success"