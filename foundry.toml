[profile.default]
src = "contracts"
out = "out"
script = "scripts"
libs = [ "node_modules" ]

solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = true

[rpc_endpoints]
baseSepolia = "https://base-sepolia.g.alchemy.com/v2/${ALCHEMY_KEY}"
base = "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"

[lint]
lint_on_build = false

