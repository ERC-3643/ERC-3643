[profile.default]
src = "contracts"
out = "out"
script = "scripts"
libs = ["dependencies"]

# Needed for UtilityChecker
via-ir = true

[profile.default.fmt]
sort_imports = true
contract_new_lines = true
bracket_spacing = true

[profile.default.lint]
lint_on_build = false
exclude_lints = [ "mixed-case-function", "pascal-case-struct", "mixed-case-variable" ]

[soldeer]
remappings_regenerate = false

[dependencies]
forge-std = "1.11.0"
"@openzeppelin-contracts" = "5.5.0"
"@openzeppelin-contracts-upgradeable" = "5.5.0"
onchain-id = { version = "2.2.2-beta3", git = "https://github.com/onchain-id/solidity.git", tag = "2.2.2-beta3" }
solady = "0.1.26"
